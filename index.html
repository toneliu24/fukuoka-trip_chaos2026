<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福岡親子旅遊規劃 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --surface2: #F0EDE6;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.15);
  --text: #1A1814;
  --text2: #6B6560;
  --text3: #9E9890;
  --accent: #C8440A;
  --accent-light: #FBF0EB;
  --blue: #1A4A8A;
  --blue-light: #EBF1FA;
  --green: #1A6A3A;
  --green-light: #EBF5EF;
  --amber: #8A5A00;
  --amber-light: #FBF5EB;
  --radius: 12px;
  --radius-sm: 8px;
  --font: 'Noto Sans TC', sans-serif;
  --mono: 'DM Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ── Layout ── */
.app{max-width:900px;margin:0 auto;padding:0 16px 80px}

/* ── Header ── */
.header{padding:28px 0 20px;border-bottom:1px solid var(--border)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.trip-title{font-size:22px;font-weight:700;letter-spacing:-0.5px;line-height:1.2}
.trip-title span{color:var(--accent)}
.trip-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.chip.accent{background:var(--accent-light);color:var(--accent);border-color:rgba(200,68,10,0.15)}
.version-badge{font-family:var(--mono);font-size:11px;color:var(--text3);background:var(--surface2);padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);white-space:nowrap}

/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:20px 0}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;transition:border-color 0.2s}
.stat-card:hover{border-color:var(--border-strong)}
.stat-num{font-size:26px;font-weight:700;letter-spacing:-1px;color:var(--text)}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px;font-weight:500}

/* ── Section headers ── */
.section{margin-top:28px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.section-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-0.3px}
.section-icon{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

/* ── Filter pills ── */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.filter-row::-webkit-scrollbar{height:0}
.fpill{font-size:12px;font-weight:500;padding:5px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all 0.15s}
.fpill:hover{border-color:var(--border-strong);background:var(--surface2)}
.fpill.active{background:var(--text);color:#fff;border-color:var(--text)}

/* ── Database table ── */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.tbl-wrap table{width:100%;border-collapse:collapse;font-size:12px;table-layout:auto}
.tbl-wrap th{font-size:11px;font-weight:600;color:var(--text3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;text-transform:uppercase;letter-spacing:0.5px}
.tbl-wrap td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
.tbl-wrap tr:last-child td{border-bottom:none}
.tbl-wrap tr:hover td{background:#FAFAF8}
.item-name{font-weight:600;font-size:13px;color:var(--text)}
.item-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* Mobile card view for DB */
.db-cards{display:none}
@media(max-width:640px){
  .tbl-wrap.db-tbl{display:none}
  .db-cards{display:flex;flex-direction:column;gap:10px}
}
.db-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;transition:border-color 0.2s}
.db-card:hover{border-color:var(--border-strong)}
.db-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.db-card-name{font-size:14px;font-weight:600}
.db-card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.db-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.db-card-field{font-size:11px}
.db-card-field-label{color:var(--text3);margin-bottom:1px}
.db-card-field-val{color:var(--text2);font-weight:500}

/* ── Tags ── */
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:0.2px}
.tag-must{background:#FBF0EB;color:#C8440A}
.tag-want{background:var(--amber-light);color:var(--amber)}
.tag-maybe{background:var(--green-light);color:var(--green)}
.tag-shop{background:var(--blue-light);color:var(--blue)}
.tag-food{background:var(--green-light);color:var(--green)}
.tag-spot{background:#F0EBFB;color:#5A2A8A}
.tag-kid{background:#FBF0F5;color:#8A1A4A}
.tag-rain{background:var(--surface2);color:var(--text2)}
.tag-gift{background:var(--amber-light);color:var(--amber)}
.tag-add{background:var(--green-light);color:var(--green)}
.tag-warn{background:var(--amber-light);color:var(--amber)}
.tag-backup{background:var(--blue-light);color:var(--blue)}

/* ── Day cards ── */
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color 0.2s;margin-bottom:12px}
.day-card:hover{border-color:var(--border-strong)}
.day-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap;background:var(--surface2)}
.day-date{font-size:16px;font-weight:700;letter-spacing:-0.5px}
.day-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px}
.day-theme{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-light);color:var(--accent)}
.day-sat-low{background:var(--green-light);color:var(--green);font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
.day-sat-mid{background:var(--amber-light);color:var(--amber);font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
.day-sat-high{background:var(--accent-light);color:var(--accent);font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
.day-body{padding:14px 16px;display:grid;gap:10px}
.day-row{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:baseline}
@media(max-width:400px){.day-row{grid-template-columns:70px 1fr}}
.day-row-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px;padding-top:1px}
.day-row-val{font-size:13px;color:var(--text2);line-height:1.6}
.day-row-val.main{color:var(--text);font-weight:500}

/* ── Add item ── */
.add-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-top:10px}
.add-bar-title{font-size:12px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;font-family:var(--font);font-size:13px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);outline:none;transition:border-color 0.15s}
.add-row input::placeholder{color:var(--text3)}
.add-row input:focus{border-color:var(--border-strong)}
.add-row button{font-family:var(--font);font-size:13px;font-weight:600;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--text);background:var(--text);color:#fff;cursor:pointer;white-space:nowrap;transition:opacity 0.15s}
.add-row button:hover{opacity:0.85}
.add-hint{font-size:11px;color:var(--text3);margin-top:8px;line-height:1.6}

/* ── Action buttons ── */
.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media(max-width:520px){.action-grid{grid-template-columns:1fr}}
.action-btn{font-family:var(--font);font-size:13px;font-weight:600;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s;text-align:center;line-height:1.4}
.action-btn:hover{background:var(--surface2);border-color:var(--border-strong)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.action-btn.primary:hover{opacity:0.9}
.action-btn.secondary{background:var(--blue-light);border-color:rgba(26,74,138,0.2);color:var(--blue)}
.action-btn.secondary:hover{background:#D8E8F8}
.btn-emoji{font-size:18px;line-height:1}

/* ── Warnings ── */
.warning-list{display:flex;flex-direction:column;gap:8px}
.warning-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;line-height:1.6}
.warning-item.orange{background:var(--amber-light);color:var(--amber)}
.warning-item.blue{background:var(--blue-light);color:var(--blue)}
.warning-item.gray{background:var(--surface2);color:var(--text2)}
.warning-icon{font-size:16px;flex-shrink:0;margin-top:1px}

/* ── Rain grid ── */
.rain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.rain-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;transition:border-color 0.2s}
.rain-card:hover{border-color:var(--border-strong)}
.rain-card-name{font-size:14px;font-weight:700}
.rain-card-sub{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.5}

/* ── Divider ── */
.divider{height:1px;background:var(--border);margin:28px 0}

/* ── Collapsible section ── */
.collapse-header{cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center}
.collapse-header .chevron{font-size:16px;color:var(--text3);transition:transform 0.2s;display:inline-block}
.collapse-header.open .chevron{transform:rotate(180deg)}
.collapse-body{overflow:hidden;transition:max-height 0.3s ease;max-height:0}
.collapse-body.open{max-height:9999px}

/* ── No results ── */
.empty{text-align:center;padding:32px;color:var(--text3);font-size:13px}

/* ── Swipe-to-delete ── */
.swipe-wrap{position:relative;overflow:hidden;border-radius:var(--radius);margin-bottom:10px}
.swipe-wrap .db-card{margin-bottom:0;border-radius:var(--radius);transition:transform 0.25s ease;will-change:transform;touch-action:pan-y}
.delete-bg{position:absolute;top:0;right:0;bottom:0;width:80px;background:#C8440A;display:flex;align-items:center;justify-content:center;border-radius:0 var(--radius) var(--radius) 0;pointer-events:none}
.delete-bg span{color:#fff;font-size:12px;font-weight:700;letter-spacing:0.3px}
.swipe-wrap.confirm .db-card{transform:translateX(-80px)}
.delete-confirm-bar{display:none;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--accent-light);border:1px solid rgba(200,68,10,0.2);border-radius:var(--radius-sm);margin-top:6px;font-size:13px;color:var(--accent)}
.swipe-wrap.confirm .delete-confirm-bar{display:flex}
.del-yes{font-family:var(--font);font-size:12px;font-weight:700;padding:6px 14px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;cursor:pointer}
.del-no{font-family:var(--font);font-size:12px;font-weight:600;padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer}

/* ── Sticky FAB on mobile ── */
@media(max-width:640px){
  .fab{display:flex;position:fixed;bottom:20px;right:16px;z-index:100;gap:8px}
  .fab-btn{font-family:var(--font);font-size:13px;font-weight:700;padding:12px 18px;border-radius:999px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.15);transition:opacity 0.2s}
  .fab-btn.primary{background:var(--accent);color:#fff}
  .fab-btn:hover{opacity:0.88}
}
@media(min-width:641px){.fab{display:none}}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="trip-title">福岡<span>親子</span>旅遊規劃</div>
        <div class="trip-meta">
          <span class="chip accent">2026 / 6 / 11 – 15</span>
          <span class="chip">4泊4日</span>
          <span class="chip">2大2小（4歲＋2歲）</span>
          <span class="chip">天神南昆塔莎</span>
          <span class="chip">梅雨季</span>
        </div>
      </div>
      <div class="version-badge" id="version-badge">v1 · 最後更新：今日</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-num" id="stat-total">12</div>
      <div class="stat-label">願望清單總數</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-must">5</div>
      <div class="stat-label">必去項目</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">4</div>
      <div class="stat-label">可用天數</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-unplaced">1</div>
      <div class="stat-label">未排入行程</div>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="action-grid">
    <button class="action-btn primary" onclick="promptAI('請根據目前資料庫幫我一鍵排出 6/11–6/15 福岡每日完整行程，包含時段安排、順路邏輯與雨天備案，並更新 Dashboard。')">
      <span class="btn-emoji">🗓</span>一鍵排出完整行程
    </button>
    <button class="action-btn secondary" onclick="promptAI('請幫我檢查目前福岡行程是否有過飽、順路問題或遺漏的必去項目，並給我具體調整建議。')">
      <span class="btn-emoji">🔍</span>行程健檢
    </button>
    <button class="action-btn" onclick="promptAI('請列出目前願望清單中還沒排入任何一天的項目，建議保留、刪除還是移為備案。')">
      <span class="btn-emoji">📋</span>檢查未排項目
    </button>
  </div>

  <!-- Add item — moved to top -->
  <div class="add-bar">
    <div class="add-bar-title">➕ 新增旅遊靈感</div>
    <div class="add-row">
      <input type="text" id="add-input" placeholder="輸入景點、店家、餐廳… 按 Enter 送出">
      <button onclick="addItem()">新增 →</button>
    </div>
    <div class="add-hint">不需整理格式，想到什麼就丟什麼。也可以直接在對話框貼上多筆清單，我會一次處理。</div>
  </div>

  <div class="divider"></div>

  <!-- Wishlist DB -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">
        <div class="section-icon" style="background:#EBF1FA;color:var(--blue)">✦</div>
        願望清單資料庫
      </div>
    </div>

    <div class="filter-row" id="filter-row">
      <button class="fpill active" onclick="filterDB(this,'all')">全部</button>
      <button class="fpill" onclick="filterDB(this,'shop')">想逛店面</button>
      <button class="fpill" onclick="filterDB(this,'food')">想吃餐廳</button>
      <button class="fpill" onclick="filterDB(this,'spot')">想去景點</button>
      <button class="fpill" onclick="filterDB(this,'kid')">親子友善</button>
      <button class="fpill" onclick="filterDB(this,'rain')">雨天備案</button>
      <button class="fpill" onclick="filterDB(this,'gift')">伴手禮</button>
    </div>

    <!-- Desktop table -->
    <div class="tbl-wrap db-tbl">
      <table>
        <thead>
          <tr>
            <th>項目名稱</th>
            <th>類型</th>
            <th>區域</th>
            <th>優先度</th>
            <th>停留</th>
            <th>預估花費</th>
            <th>需預約</th>
            <th>建議天</th>
            <th>可順路</th>
            <th>AI建議</th>
          </tr>
        </thead>
        <tbody id="db-tbody"></tbody>
      </table>
    </div>

    <!-- Mobile cards -->
    <div class="db-cards" id="db-cards"></div>

  </div>

  <div class="divider"></div>

  <!-- Dashboard -->
  <div class="section">
    <div class="section-title" style="margin-bottom:14px">
      <div class="section-icon" style="background:var(--accent-light);color:var(--accent)">◈</div>
      旅程總覽 Dashboard
    </div>
    <div id="days-container"></div>
  </div>

  <div class="divider"></div>

  <!-- Rain backup -->
  <div class="section">
    <div class="collapse-header" onclick="toggleCollapse('rain-body', this)">
      <div class="section-title">
        <div class="section-icon" style="background:var(--blue-light);color:var(--blue)">☂</div>
        雨天備案庫
      </div>
      <span class="chevron">▾</span>
    </div>
    <div class="collapse-body" id="rain-body">
      <div style="height:12px"></div>
      <div class="rain-grid" id="rain-grid"></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Warnings -->
  <div class="section">
    <div class="collapse-header" onclick="toggleCollapse('warn-body', this)">
      <div class="section-title">
        <div class="section-icon" style="background:var(--amber-light);color:var(--amber)">⚑</div>
        待確認 & 注意事項
      </div>
      <span class="chevron">▾</span>
    </div>
    <div class="collapse-body" id="warn-body">
      <div style="height:12px"></div>
      <div class="warning-list" id="warn-list"></div>
    </div>
  </div>

</div>

<!-- Mobile FAB -->
<div class="fab">
  <button class="fab-btn primary" onclick="promptAI('請根據目前資料庫幫我一鍵排出 6/11–6/15 福岡每日完整行程，包含時段安排、順路邏輯與雨天備案，並更新 Dashboard。')">🗓 一鍵排程</button>
</div>

<script>
/* ── Data ── */
const DB = [
  {id:1,name:"UNIQLO",cat:"shop",area:"天神",pri:"must",stay:"60–90分",cost:"¥5,000–20,000",rsv:"否",day:"6/12",near:"無印良品",ai:"加入"},
  {id:2,name:"無印良品",cat:"shop",area:"天神",pri:"must",stay:"45–60分",cost:"¥3,000–15,000",rsv:"否",day:"6/12",near:"UNIQLO",ai:"加入"},
  {id:3,name:"HOKA",cat:"shop",area:"天神（待確認）",pri:"must",stay:"30–45分",cost:"¥18,000–30,000",rsv:"否",day:"6/12",near:"UNIQLO",ai:"加入⚠️"},
  {id:4,name:"小孩衣服掃貨",cat:"shop",area:"天神",pri:"must",stay:"60分",cost:"¥5,000–15,000",rsv:"否",day:"6/12",near:"UNIQLO",ai:"加入"},
  {id:5,name:"藥妝掃貨",cat:"shop",area:"天神",pri:"must",stay:"60–90分",cost:"¥5,000–20,000",rsv:"否",day:"6/11晚+6/15早",near:"天神地下街",ai:"加入"},
  {id:6,name:"伴手禮（明太子等）",cat:"gift",area:"博多",pri:"must",stay:"30–45分",cost:"¥3,000–10,000",rsv:"否",day:"6/14",near:"柳橋市場",ai:"加入"},

/* ── Swipe-to-delete logic ── */
let activeSwipe = null;

function bindSwipe(){
  document.querySelectorAll(".swipe-wrap .db-card").forEach(card => {
    const wrap = card.closest(".swipe-wrap");
    const id = parseInt(wrap.id.replace("swipe-",""));
    let startX = 0, startY = 0, dragging = false, moved = false;

    card.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      dragging = true; moved = false;
    }, {passive:true});

    card.addEventListener("touchmove", e => {
      if(!dragging) return;
      const dx = e.touches[0].clientX - startX;
      const dy = Math.abs(e.touches[0].clientY - startY);
      if(dy > 10 && !moved) { dragging = false; return; }
      if(dx < -10) { moved = true; }
    }, {passive:true});

    card.addEventListener("touchend", e => {
      if(!dragging || !moved) return;
      dragging = false;
      const dx = e.changedTouches[0].clientX - startX;
      if(dx < -40) {
        if(activeSwipe && activeSwipe !== wrap) cancelDelete(parseInt(activeSwipe.id.replace("swipe-","")));
        wrap.classList.add("confirm");
        activeSwipe = wrap;
      }
    });
  });
}

function cancelDelete(id){
  const wrap = document.getElementById("swipe-"+id);
  if(wrap){ wrap.classList.remove("confirm"); }
  if(activeSwipe === wrap) activeSwipe = null;
}

function confirmDelete(id){
  const idx = DB.findIndex(d=>d.id===id);
  if(idx > -1){
    const name = DB[idx].name;
    DB.splice(idx,1);
    renderDB();
    bindSwipe();
    showToast("「"+name+"」已刪除");
  }
}

document.addEventListener("touchstart", e => {
  if(activeSwipe && !activeSwipe.contains(e.target)){
    cancelDelete(parseInt(activeSwipe.id.replace("swipe-","")));
  }
}, {passive:true});

/* ── Prompt AI (copy to clipboard + alert) ── */
function promptAI(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>{
      showToast("已複製到剪貼簿，請貼到 Claude 對話框送出 ✓");
    }).catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
  showToast("已複製到剪貼簿，請貼到 Claude 對話框送出 ✓");
}

/* ── Toast ── */
let toastTimeout;
function showToast(msg){
  let t = document.getElementById("toast");
  if(!t){
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1A1814;color:#fff;font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:500;padding:10px 20px;border-radius:999px;z-index:9999;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>{ t.style.opacity="0"; }, 3000);
}
